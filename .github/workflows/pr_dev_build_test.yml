name: PR Build & Test (dev)

# Concurrency: Automatically cancel redundant in-progress CI runs when new commits are pushed to the PR
concurrency:
  group: pr-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - dev
  workflow_dispatch:

# Strict read-only permissions: Ensures pull requests cannot release, tag, or publish artifacts to registries
permissions:
  contents: read
  pull-requests: read

jobs:
  lint-and-audit:
    name: Code Quality & Lint Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Lint Tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 black

      - name: Fatal Syntax & Undefined Name Check (E9, F63, F7, F82)
        run: |
          # Stop the build if there are genuine syntax errors or undefined symbols
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,build,dist

      - name: Informative Style & Formatting Audit
        run: |
          # Output warnings for line length, style, and complexity without failing the PR build
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics --exclude=.venv,build,dist

  build-and-test:
    name: Build & Test (${{ matrix.os }} - Py${{ matrix.python-version }})
    needs: lint-and-audit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout pull request code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade Core Packaging & Build Tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel cython "numpy>=1.24.0" build

      - name: Compile Cython C++ Extensions In-Place (rolling & expanding)
        run: |
          python -c "from setuptools import setup, Extension; from Cython.Build import cythonize; import numpy; extensions = [Extension('qlib.data._libs.rolling', ['qlib/data/_libs/rolling.pyx'], language='c++', include_dirs=[numpy.get_include()]), Extension('qlib.data._libs.expanding', ['qlib/data/_libs/expanding.pyx'], language='c++', include_dirs=[numpy.get_include()])]; setup(ext_modules=cythonize(extensions, language_level='3'), script_args=['build_ext', '--inplace'])"

      - name: Install Package in Editable Mode with Dependencies
        run: |
          python -m pip install -e .
          python -m pip install pytest pytest-cov scipy pandas requests

      - name: Verify Package Wheel Build (Verification Only - No Release)
        run: |
          python -m build --wheel

      - name: Run Core Institutional Production Test Suite (52 Tests)
        run: |
          python scripts/run_all_tests.py -v

      - name: Run Fast Pytest Suite
        run: |
          python -m pytest tests/ -m "not slow" --ignore=tests/test_all_pipeline.py

      - name: Archive Built Wheel for PR Inspection (No Release)
        uses: actions/upload-artifact@v4
        with:
          name: qlib-wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
          retention-days: 3
          if-no-files-found: warn

